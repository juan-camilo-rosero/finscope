<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finscope — Crédito de Carro Pre-aprobado</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #FAFAFA;
      color: #212121;
      min-height: 100vh;
      overflow-y: auto;
      line-height: 1.5;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #DEDBD7;
      border-radius: 3px;
    }
    input[type=range] {
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: transparent;
      width: 100%;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ee252a;
      box-shadow: 0 2px 6px rgba(238, 37, 42, 0.35);
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Layout Classes */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #FFFFFF;
      border-bottom: 1px solid #EEEEEE;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      animation: fadeUp 0.3s ease;
    }

    /* Grid Layouts */
    .grid-p1 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: start;
    }
    .grid-p2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      align-items: start;
    }
    .grid-estado {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      align-items: start;
    }

    @media (min-width: 992px) {
      .grid-p1 {
        grid-template-columns: 1.15fr 0.85fr;
        gap: 50px;
      }
      .grid-p2 {
        grid-template-columns: 1fr 1fr;
      }
      .grid-estado {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    /* Vencimiento Badge */
    .badge-vence {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #92400E;
    }
    .badge-vence-text-long {
      display: inline;
    }
    .badge-vence-text-short {
      display: none;
    }

    @media (max-width: 600px) {
      .badge-vence-text-long {
        display: none;
      }
      .badge-vence-text-short {
        display: inline;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  magenta: '#ee252a',
  magentaL: 'rgba(238,37,42,0.06)',
  blue: '#3f5cdd',
  success: '#16a34a',
  successL: '#dcfce7',
  warn: '#f59e0b',
  g900: '#212121',
  g700: '#616161',
  g500: '#9E9E9E',
  g200: '#EEEEEE',
  g50: '#FAFAFA',
  white: '#FFFFFF'
};

/* Helpers */
function calcCuota(m, p) {
  const r = Math.pow(1.152, 1/12) - 1;
  return Math.round(m * r / (1 - Math.pow(1 + r, -p)));
}
function fmt(n) {
  return '$' + n.toLocaleString('es-CO');
}
function fmtMiles(n) {
  return Number(n).toLocaleString('es-CO');
}

function Logo({ size = 20 }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div style={{ background: '#fff', borderRadius: 7, padding: 3, boxShadow: '0 1px 4px rgba(0,0,0,0.08)', display: 'flex' }}>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNeXv430JYlhQn-ZR5_n8_rNfgFfjvDVcW0Wv0YexVpbxpplcAREANAGBi&s=10" width={size + 6} height={size + 6} alt="Finscope Logo" style={{ display: 'block' }} />
      </div>
      <span style={{ fontWeight: 700, fontSize: size + 2, color: C.g900, letterSpacing: '-0.4px' }}>Finscope</span>
    </div>
  );
}

function SliderPlus({ value, min, max, step = 1, onChange, label, isMoney = false, suffix = '' }) {
  const pct = ((value - min) / (max - min)) * 100;
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');

  function commit() {
    let v = parseInt(String(draft).replace(/\D/g, ''), 10);
    if (isNaN(v)) v = value;
    v = Math.min(max, Math.max(min, v));
    onChange(v);
    setEditing(false);
  }

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <span style={{ fontSize: 13, color: C.g700, fontWeight: 500 }}>{label}</span>
        {editing ? (
          <input
            autoFocus
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e => e.key === 'Enter' && commit()}
            style={{ fontSize: 14, fontWeight: 600, color: C.g900, border: `1.5px solid ${C.magenta}`, borderRadius: 6, padding: '2px 8px', width: 140, textAlign: 'right', outline: 'none', fontFamily: 'Roboto' }}
          />
        ) : (
          <button
            onClick={() => { setEditing(true); setDraft(isMoney ? fmtMiles(value) : String(value)); }}
            style={{ fontSize: 14, fontWeight: 600, color: C.g900, background: 'transparent', border: 'none', cursor: 'pointer', padding: '2px 4px', fontFamily: 'Roboto', borderBottom: `1px dashed ${C.g500}` }}
          >
            {isMoney ? fmt(value) : value + suffix} ✏️
          </button>
        )}
      </div>
      <div style={{ position: 'relative' }}>
        <div style={{ position: 'absolute', top: '50%', left: 0, right: 0, height: 4, transform: 'translateY(-50%)', borderRadius: 2, background: C.g200 }} />
        <div style={{ position: 'absolute', top: '50%', left: 0, width: `${pct}%`, height: 4, transform: 'translateY(-50%)', borderRadius: 2, background: C.magenta }} />
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={e => onChange(Number(e.target.value))}
          style={{ position: 'relative', zIndex: 2, width: '100%', background: 'transparent' }}
        />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
        <span style={{ fontSize: 11, color: C.g500 }}>{isMoney ? fmt(min) : min + suffix}</span>
        <span style={{ fontSize: 11, color: C.g500 }}>{isMoney ? fmt(max) : max + suffix}</span>
      </div>
      <p style={{ fontSize: 10, color: C.g500, marginTop: 6, fontStyle: 'italic' }}>Toca el valor para escribirlo exacto.</p>
    </div>
  );
}

function UploadSlot({ label, optional = false, onUploaded }) {
  const [s, setS] = useState('empty');

  function tap() {
    if (s === 'done') return;
    setS('loading');
    setTimeout(() => {
      setS('done');
      onUploaded?.();
    }, 900);
  }

  return (
    <div
      onClick={tap}
      style={{
        flex: 1,
        minHeight: 92,
        borderRadius: 10,
        border: `1.5px dashed ${s === 'done' ? C.success : C.g200}`,
        background: s === 'done' ? C.successL : C.g50,
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        justifyContent: 'center',
        gap: 6,
        cursor: s === 'done' ? 'default' : 'pointer',
        padding: 12,
        transition: 'all 0.2s'
      }}
    >
      {s === 'empty' && (
        <>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="4" stroke={C.g500} strokeWidth="1.5"/>
            <path d="M12 8v8M8 12h8" stroke={C.g500} strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          <span style={{ fontSize: 11, color: C.g500, textAlign: 'center', lineHeight: 1.4 }}>{optional ? 'Opcional' : label}</span>
        </>
      )}
      {s === 'loading' && (
        <>
          <div style={{ width: 20, height: 20, borderRadius: '50%', border: `2px solid ${C.g200}`, borderTopColor: C.success, animation: 'spin 0.7s linear infinite' }} />
          <span style={{ fontSize: 11, color: C.g500 }}>Subiendo…</span>
        </>
      )}
      {s === 'done' && (
        <>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="11" cy="11" r="10" fill={C.success}/>
            <path d="M6.5 11l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span style={{ fontSize: 11, color: C.success, fontWeight: 600, textAlign: 'center' }}>{label} subido</span>
        </>
      )}
    </div>
  );
}

function Toast({ msg, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2800);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ position: 'fixed', bottom: 30, left: '50%', transform: 'translateX(-50%)', background: C.g900, color: '#fff', padding: '12px 20px', borderRadius: 10, fontSize: 13, zIndex: 500, boxShadow: '0 10px 30px rgba(0,0,0,0.3)', display: 'flex', alignItems: 'center', gap: 10, animation: 'fadeUp 0.25s ease' }}>
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="10" fill={C.success}/>
        <path d="M6.5 11l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {msg}
    </div>
  );
}

function ConfirmModal({ title, body, confirmLabel, danger = false, onConfirm, onCancel }) {
  return (
    <div
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 400, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, animation: 'fadeUp 0.2s ease' }}
      onClick={onCancel}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: C.white, borderRadius: 16, padding: '26px 24px 20px', maxWidth: 420, width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.25)', animation: 'pop 0.2s ease' }}
      >
        <h3 style={{ fontSize: 17, fontWeight: 700, color: C.g900, marginBottom: 8 }}>{title}</h3>
        <p style={{ fontSize: 13, color: C.g700, lineHeight: 1.7, marginBottom: 22 }}>{body}</p>
        <div style={{ display: 'flex', gap: 10, flexDirection: 'column' }}>
          <button onClick={onConfirm} style={{ padding: 13, borderRadius: 10, background: danger ? '#dc2626' : C.magenta, color: '#fff', fontSize: 14, fontWeight: 600, border: 'none', cursor: 'pointer', fontFamily: 'Roboto' }}>
            {confirmLabel}
          </button>
          <button onClick={onCancel} style={{ padding: 13, borderRadius: 10, background: 'transparent', color: C.g700, fontSize: 14, fontWeight: 500, border: `1px solid ${C.g200}`, cursor: 'pointer', fontFamily: 'Roboto' }}>
            Cancelar
          </button>
        </div>
      </div>
    </div>
  );
}

const VEHICLE_CATALOG = [
  { brand: 'Renault', models: [{ name: 'Kwid 2024', price: 38500000 }, { name: 'Logan 2023', price: 41900000 }, { name: 'Stepway 2023', price: 46500000 }, { name: 'Duster 2024', price: 62000000 }] },
  { brand: 'Chevrolet', models: [{ name: 'Spark GT 2024', price: 36900000 }, { name: 'Onix 2023', price: 40500000 }, { name: 'Onix 2024', price: 42800000 }, { name: 'Tracker 2024', price: 65000000 }] },
  { brand: 'Kia', models: [{ name: 'Picanto 2024', price: 39900000 }, { name: 'Rio 2023', price: 42000000 }, { name: 'Soluto 2024', price: 44500000 }, { name: 'Sonet 2024', price: 69000000 }] },
  { brand: 'Mazda', models: [{ name: 'Mazda 2 2023', price: 41800000 }, { name: 'Mazda 2 2024', price: 45500000 }, { name: 'CX-3 2023', price: 58000000 }, { name: 'CX-30 2024', price: 78000000 }] }
];

function VehicleCatalog({ monto, selected, onSelect }) {
  const [brandIdx, setBrandIdx] = useState(0);
  const [cuotaInicial, setCuotaInicial] = useState(0);
  const [showOver, setShowOver] = useState(false);
  const [sheet, setSheet] = useState(null);
  const [draft, setDraft] = useState(0);

  const brand = VEHICLE_CATALOG[brandIdx];
  const capacidad = monto + cuotaInicial;
  const fitting = brand.models.filter(m => m.price <= capacidad);
  const over = brand.models.filter(m => m.price > capacidad);

  function openSheet(min) {
    setDraft(Math.max(min, cuotaInicial));
    setSheet({ min });
  }

  function applySheet() {
    setCuotaInicial(draft);
    setSheet(null);
    setShowOver(true);
  }

  return (
    <div>
      <p style={{ fontSize: 12, color: C.g500, marginBottom: 12, lineHeight: 1.5 }}>
        Modelos sugeridos dentro de tu presupuesto de compra de <strong style={{ color: C.g900 }}>{fmt(capacidad)}</strong> {cuotaInicial > 0 ? `(${fmt(monto)} financiado + ${fmt(cuotaInicial)} cuota inicial)` : ''}.
      </p>
      
      {/* Brands Selector */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
        {VEHICLE_CATALOG.map((b, i) => (
          <button
            key={b.brand}
            onClick={() => setBrandIdx(i)}
            style={{ padding: '6px 12px', borderRadius: 18, fontSize: 12, border: `1px solid ${brandIdx === i ? C.magenta : C.g200}`, background: brandIdx === i ? C.magentaL : C.white, color: brandIdx === i ? C.magenta : C.g700, cursor: 'pointer', fontFamily: 'Roboto', fontWeight: brandIdx === i ? 600 : 400 }}
          >
            {b.brand}
          </button>
        ))}
      </div>

      {cuotaInicial > 0 && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: C.magentaL, border: `1px solid ${C.magenta}`, borderRadius: 10, marginBottom: 12 }}>
          <div style={{ flex: 1, fontSize: 12, color: C.g900 }}>
            <strong>Cuota inicial: {fmt(cuotaInicial)}</strong>
            <div style={{ fontSize: 11, color: C.g500, marginTop: 1 }}>Aportada al concesionario</div>
          </div>
          <button onClick={() => openSheet(0)} style={{ background: 'none', border: 'none', color: C.blue, fontSize: 12, cursor: 'pointer', padding: 0 }}>Editar</button>
          <button onClick={() => { setCuotaInicial(0); setShowOver(false); }} style={{ background: 'none', border: 'none', color: C.g500, fontSize: 12, cursor: 'pointer', padding: 0, marginLeft: 8 }}>Quitar</button>
        </div>
      )}

      {/* Models In Range */}
      {fitting.length === 0 ? (
        <div style={{ padding: '18px 14px', background: C.g50, border: `1px dashed ${C.g200}`, borderRadius: 10, textAlign: 'center' }}>
          <p style={{ fontSize: 13, color: C.g700, fontWeight: 500, marginBottom: 4 }}>Ningún modelo de {brand.brand} cabe en {fmt(capacidad)}.</p>
          <p style={{ fontSize: 12, color: C.g500, marginBottom: 10 }}>Prueba con otra marca o aporta una cuota inicial.</p>
          <button onClick={() => openSheet(over[0] ? over[0].price - capacidad : 1000000)} style={{ padding: '8px 14px', borderRadius: 8, background: C.magenta, color: '#fff', fontSize: 12, fontWeight: 600, border: 'none', cursor: 'pointer' }}>
            Agregar cuota inicial
          </button>
        </div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {fitting.map(m => {
            const sel = selected === m.name;
            return (
              <div
                key={m.name}
                onClick={() => onSelect(m.name)}
                style={{ borderRadius: 10, border: `1.5px solid ${sel ? C.magenta : C.g200}`, background: sel ? C.magentaL : C.g50, padding: 12, cursor: 'pointer', transition: 'all 0.15s' }}
              >
                <div style={{ height: 60, background: 'repeating-linear-gradient(45deg,#e8e6e3,#e8e6e3 6px,#dedbd7 6px,#dedbd7 12px)', borderRadius: 6, marginBottom: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.g500, fontSize: 10, fontFamily: 'monospace' }}>
                  Vehículo
                </div>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.g900, marginBottom: 2 }}>{m.name}</div>
                <div style={{ fontSize: 11, color: C.g500 }}>{fmt(m.price)}</div>
                {sel && <div style={{ fontSize: 11, color: C.magenta, marginTop: 4, fontWeight: 600 }}>✓ Seleccionado</div>}
              </div>
            );
          })}
        </div>
      )}

      {/* Models Above Range */}
      {over.length > 0 && !showOver && (
        <button
          onClick={() => setShowOver(true)}
          style={{ width: '100%', marginTop: 12, padding: '10px 12px', background: 'transparent', border: `1px dashed ${C.g200}`, borderRadius: 10, color: C.g700, fontSize: 12, cursor: 'pointer', fontFamily: 'Roboto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
        >
          <span>{over.length} modelo{over.length > 1 ? 's' : ''} requiere{over.length > 1 ? 'n' : ''} cuota inicial</span>
          <span style={{ color: C.blue, fontWeight: 500 }}>Ver →</span>
        </button>
      )}

      {showOver && over.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
            <p style={{ fontSize: 11, color: C.g500, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.6px', flex: 1 }}>Requieren cuota inicial</p>
            <button onClick={() => setShowOver(false)} style={{ background: 'none', border: 'none', color: C.g500, fontSize: 11, cursor: 'pointer', padding: 0 }}>Ocultar</button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {over.map(m => {
              const falta = m.price - capacidad;
              return (
                <div key={m.name} style={{ borderRadius: 10, border: `1px solid ${C.g200}`, background: C.white, padding: 12, display: 'flex', gap: 12, alignItems: 'center' }}>
                  <div style={{ width: 60, height: 44, background: 'repeating-linear-gradient(45deg,#f0eeec,#f0eeec 6px,#e6e3e0 6px,#e6e3e0 12px)', borderRadius: 6, flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: C.g900 }}>{m.name}</div>
                    <div style={{ fontSize: 11, color: C.g500 }}>{fmt(m.price)} · falta <strong style={{ color: C.warn }}>{fmt(falta)}</strong></div>
                  </div>
                  <button onClick={() => openSheet(falta)} style={{ padding: '7px 10px', borderRadius: 8, background: C.magentaL, border: `1px solid ${C.magenta}`, color: C.magenta, fontSize: 11, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
                    Aportar {fmt(falta).replace('$ ', '$')}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sheet && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)', zIndex: 300, display: 'flex', alignItems: 'flex-end', animation: 'fadeUp 0.2s' }} onClick={() => setSheet(null)}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.white, borderRadius: '16px 16px 0 0', width: '100%', padding: '22px 20px 24px', animation: 'fadeUp 0.25s' }}>
            <div style={{ width: 36, height: 4, background: C.g200, borderRadius: 2, margin: '0 auto 16px' }} />
            <p style={{ fontSize: 17, fontWeight: 600, color: C.g900, marginBottom: 6 }}>Agregar cuota inicial</p>
            <p style={{ fontSize: 12, color: C.g500, marginBottom: 18, lineHeight: 1.5 }}>
              La cuota inicial te permite acceder a vehículos que superan tu cupo de crédito pre-aprobado.
            </p>
            <div style={{ padding: '14px 14px', background: C.g50, borderRadius: 10, marginBottom: 16 }}>
              <p style={{ fontSize: 11, color: C.g500, marginBottom: 4 }}>Monto cuota inicial</p>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                <span style={{ fontSize: 18, color: C.g700 }}>$</span>
                <input
                  type="text"
                  inputMode="numeric"
                  value={draft.toLocaleString('es-CO')}
                  onChange={e => { const n = parseInt(e.target.value.replace(/\D/g, '')) || 0; setDraft(Math.min(n, 200000000)); }}
                  style={{ flex: 1, fontSize: 24, fontWeight: 700, color: C.g900, border: 'none', background: 'transparent', outline: 'none', fontFamily: 'Roboto' }}
                />
              </div>
              <input
                type="range"
                min="0"
                max="50000000"
                step="500000"
                value={draft}
                onChange={e => setDraft(parseInt(e.target.value))}
                style={{ width: '100%', marginTop: 10, accentColor: C.magenta }}
              />
              <div style={{ display: 'flex', justify: 'space-between', justifyContent: 'space-between', fontSize: 10, color: C.g500, marginTop: 2 }}>
                <span>$0</span>
                <span>$50.000.000</span>
              </div>
            </div>
            <div style={{ padding: '12px 14px', background: C.magentaL, borderRadius: 10, marginBottom: 18 }}>

        </div>

        {/* Right Column */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>

              <UploadSlot label="Cédula (Reverso)" onUploaded={() => { setCedB(true); pushToast('Cédula cara posterior recibida'); }} />
            </div>
          </div>
        </div>
      </div>

      <div style={{ marginTop: 30, display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center', background: C.white, borderRadius: 14, padding: 24, border: '1px solid #EEEEEE', boxShadow: '0 4px 12px rgba(0,0,0,0.02)' }}>

        </button>
        {!all && (
          <p style={{ fontSize: 13, color: '#dc2626', fontWeight: 500, marginTop: 4 }}>
            Falta: {!vehiculo ? 'elegir vehículo de catálogo • ' : ''}{!cedF || !cedB ? 'subir documento de identidad • ' : ''}{(!ch1 || !ch2) ? 'aceptar declaraciones obligatorias' : ''}
          </p>
        )}
      </div>

      {confirmActivar && <ConfirmModal
        title="¿Confirmas la activación de tu crédito?"
        body={`Estás solicitando la financiación del vehículo ${vehiculo} por un monto de ${fmt(monto)} a un plazo de ${plazo} meses. La cuota mensual estimada será de ${fmt(cuota)}. Al continuar, tu solicitud será validada automáticamente.`}
        confirmLabel="Confirmar y Enviar"
        onConfirm={() => { setConfirmActivar(false); setStatus('loading'); setTimeout(() => setStatus('success'), 2000); }}
        onCancel={() => setConfirmActivar(false)}
      />}
      {toasts.map(t => <Toast key={t.id} msg={t.msg} onDone={() => setToasts(p => p.filter(x => x.id !== t.id))} />)}
    </div>
  );

        )}
        {screen === 'estado' && (
          <EstadoScreen
            onBack={() => setScreen('p1')}
          />
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
