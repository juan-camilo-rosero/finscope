function StatusBadge({ estado }) {
  const map = {
    enviado:    { color:C.blue,    bg:C.blueL,    label:'Pendiente revisión' },
    devuelto:   { color:C.warn,    bg:C.warnL,    label:'Devuelto al analista' },
    aprobado:   { color:C.success, bg:C.successL, label:'Aprobado' },
    rechazado:  { color:C.danger,  bg:C.dangerL,  label:'Rechazado' },
  };
  const s = map[estado];
  return (
    <span style={{fontSize:11,fontWeight:600,color:s.color,background:s.bg,padding:'3px 8px',borderRadius:12,border:`1px solid ${s.color}30`,whiteSpace:'nowrap'}}>{s.label}</span>
  );
}

}

/* U6 FIX: feedback con toast + undo */
function Toast({ msg, onDone, onUndo }) {
  useEffect(()=>{ const t=setTimeout(onDone,5000); return ()=>clearTimeout(t); },[]);
  return (
    <div style={{position:'fixed',bottom:30,left:'50%',transform:'translateX(-50%)',background:C.g900,color:'#fff',padding:'12px 18px',borderRadius:10,fontSize:13,zIndex:500,boxShadow:'0 10px 30px rgba(0,0,0,0.3)',display:'flex',alignItems:'center',gap:14,animation:'fadeUp 0.25s ease'}}>
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" fill={C.success}/><path d="M6.5 11l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      {msg}
      {onUndo&&<button onClick={()=>{onUndo();onDone();}} style={{background:'transparent',border:`1px solid rgba(255,255,255,0.4)`,color:'#fff',padding:'4px 10px',borderRadius:6,fontSize:12,cursor:'pointer',fontFamily:'Roboto'}}>Deshacer</button>}
    </div>
  );
}

function ConfirmModal({ title, body, confirmLabel, danger=false, onConfirm, onCancel }) {

        <p style={{fontSize:13,color:C.g700,lineHeight:1.7,marginBottom:22}}>{body}</p>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onCancel} style={{flex:1,padding:13,borderRadius:10,background:'transparent',color:C.g700,fontSize:14,fontWeight:500,border:`1px solid ${C.g200}`,cursor:'pointer',fontFamily:'Roboto'}}>Cancelar</button>
          <button onClick={onConfirm} style={{flex:1,padding:13,borderRadius:10,background:danger?C.danger:C.success,color:'#fff',fontSize:14,fontWeight:600,border:'none',cursor:'pointer',fontFamily:'Roboto'}}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

        <div style={{borderRadius:12,background:C.white,border:`1px solid ${C.g200}`,padding:16}}>
          <p style={{fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:10}}>E — Detalle del crédito</p>
          {[['Vehículo',c.vehiculo],['Concesionario','Aliado Finandina'],['Tasa propuesta','15,2 % E.A.'],['Cuota mensual','$890.000'],['Analista',c.analista]].map(([l,v],i)=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:i<4?`1px solid ${C.g200}`:'none',fontSize:12}}>
              <span style={{color:C.g500}}>{l}</span><span style={{color:C.g900,fontWeight:500,textAlign:'right'}}>{v}</span>
            </div>
          ))}
        </div>
        {c.timeline&&<div style={{borderRadius:12,background:C.white,border:`1px solid ${C.g200}`,padding:16}}>
          <p style={{fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:10}}>F — Trazabilidad</p>
          {c.timeline.map((t,i)=>(
            <div key={i} style={{display:'flex',gap:10,paddingBottom:i<c.timeline.length-1?10:0}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:i===c.timeline.length-1?C.magenta:C.g500,marginTop:5}} />
                {i<c.timeline.length-1&&<div style={{width:1,flex:1,background:C.g200,marginTop:2}} />}
              </div>
              <div style={{flex:1,paddingBottom:i<c.timeline.length-1?6:0}}>
                <div style={{fontSize:12,color:C.g900,fontWeight:i===c.timeline.length-1?600:400}}>{t.e}</div>
                <div style={{fontSize:11,color:C.g500,marginTop:1}}>{t.t}</div>
              </div>
            </div>
          ))}
        </div>}
      </div>
      {c.estado!=='aprobado'&&c.estado!=='rechazado'&&<div style={{borderRadius:12,background:C.white,border:`1px solid ${C.g200}`,padding:16}}>
        <p style={{fontSize:14,fontWeight:600,color:C.g900,marginBottom:12}}>Decisión final</p>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <button onClick={()=>setConfirm('aprobar')} style={{padding:13,borderRadius:9,background:C.success,color:'#fff',fontSize:14,fontWeight:600,border:'none',cursor:'pointer',fontFamily:'Roboto',boxShadow:`0 4px 12px ${C.success}40`}}>
            ✓ Aprobar y enviar a desembolso
          </button>
          <button onClick={()=>setShowDevolverForm(s=>!s)} style={{padding:11,borderRadius:9,background:'transparent',color:C.warn,fontSize:13,fontWeight:500,border:`1.5px solid ${C.warn}`,cursor:'pointer',fontFamily:'Roboto'}}>
            ↺ Devolver al analista
          </button>
          {showDevolverForm&&<div style={{background:C.warnL,borderRadius:9,padding:12,border:`1px solid ${C.warn}30`}}>
            <p style={{fontSize:12,color:C.g700,marginBottom:8}}>Indica qué falta validar:</p>
            <textarea value={motivoDev} onChange={e=>setMotivoDev(e.target.value)} placeholder="p. ej. Faltan certificados de ingresos del último trimestre" style={{width:'100%',borderRadius:7,border:`1px solid ${C.g200}`,padding:9,fontSize:12,fontFamily:'Roboto',resize:'none',height:64,outline:'none'}} />
            <button disabled={motivoDev.length<10} onClick={()=>setConfirm('devolver')} style={{marginTop:8,width:'100%',padding:10,borderRadius:7,background:motivoDev.length>=10?C.warn:C.g200,color:motivoDev.length>=10?'#fff':C.g500,fontSize:13,fontWeight:600,border:'none',cursor:motivoDev.length>=10?'pointer':'not-allowed',fontFamily:'Roboto'}}>Confirmar devolución</button>
          </div>}
          <button onClick={()=>setConfirm('rechazar')} style={{padding:11,borderRadius:9,background:'transparent',color:C.danger,fontSize:13,fontWeight:500,border:`1.5px solid ${C.danger}`,cursor:'pointer',fontFamily:'Roboto'}}>
            ✕ Rechazar definitivamente
          </button>
        </div>
      </div>}
      {/* U6: doble confirmación con undo */}
      {confirm==='aprobar'&&<ConfirmModal
        title="¿Aprobar este caso?"
        body={`Confirma la aprobación de ${c.monto} para ${c.name}. El caso pasa a desembolso. Tendrás 30 segundos para deshacer.`}
        confirmLabel="Sí, aprobar"
        onConfirm={()=>{setConfirm(null);onAprobar?.();}}
        onCancel={()=>setConfirm(null)}
      />}
      {confirm==='devolver'&&<ConfirmModal
        title="¿Devolver al analista?"
        body={`El analista ${c.analista} recibirá una notificación con tu motivo. El caso vuelve a su cola con tu comentario.`}
        confirmLabel="Sí, devolver"
        onConfirm={()=>{setConfirm(null);setShowDevolverForm(false);onDevolver?.(motivoDev);}}
        onCancel={()=>setConfirm(null)}
      />}
      {confirm==='rechazar'&&<ConfirmModal
        title="¿Rechazar definitivamente?"
        body="El cliente recibirá notificación. Esta acción cierra el caso y no se puede deshacer pasados 30 segundos."
        confirmLabel="Sí, rechazar"
        danger
        onConfirm={()=>{setConfirm(null);onRechazar?.();}}
        onCancel={()=>setConfirm(null)}
      />}
    </div>
  );
}

function DesktopLayout({ data, setData }) {
  const [sel, setSel] = useState(data[0].id);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [toasts, setToasts] = useState([]);
  function push(msg, onUndo){ const id=Date.now(); setToasts(t=>[...t,{id,msg,onUndo}]); }
  const filtered = data.filter(c=>{
    if(search&&!c.id.toLowerCase().includes(search.toLowerCase())&&!c.name.toLowerCase().includes(search.toLowerCase())) return false;
    if(filterEstado!=='todos'&&c.estado!==filterEstado) return false;
    return true;
  });
  const c = data.find(x=>x.id===sel) || data[0];
  return (
    <div style={{display:'flex',height:'calc(100vh - 52px)',marginTop:52}}>
      <div style={{width:'58%',display:'flex',flexDirection:'column',background:C.white,borderRight:`1px solid ${C.g200}`}}>
        <div style={{padding:'14px 20px',borderBottom:`1px solid ${C.g200}`,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:12}}>
            <h2 style={{fontSize:16,fontWeight:600,color:C.g900}}>Cola de coordinación — {filtered.length} casos</h2>
            <span className="rite-tag">RITE U2 · U6</span>
          </div>
          <div style={{display:'flex',gap:10}}>
            {/* U6 FIX: buscador */}
            <div style={{position:'relative',flex:1}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)'}}>
                <circle cx="6" cy="6" r="5" stroke={C.g500} strokeWidth="1.5"/><path d="M10 10l3 3" stroke={C.g500} strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por solicitud o nombre" style={{width:'100%',padding:'8px 10px 8px 30px',borderRadius:8,border:`1px solid ${C.g200}`,fontSize:13,fontFamily:'Roboto',outline:'none',background:C.g50}} />
            </div>
            {/* U6 FIX: filtro como estado */}
            <select value={filterEstado} onChange={e=>setFilterEstado(e.target.value)} style={{padding:'8px 10px',borderRadius:8,border:`1px solid ${C.g200}`,fontSize:13,fontFamily:'Roboto',color:C.g700,background:C.white,outline:'none',width:200}}>
              <option value="todos">Todos los estados</option>
              <option value="enviado">Pendientes revisión</option>
              <option value="devuelto">Devueltos al analista</option>
              <option value="aprobado">Aprobados</option>
            </select>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{background:C.g50,position:'sticky',top:0,zIndex:1}}>
                <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:`1px solid ${C.g200}`}}>Cliente</th>
                <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:`1px solid ${C.g200}`}}>Monto</th>
                <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:`1px solid ${C.g200}`}}>Analista</th>
                <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:`1px solid ${C.g200}`}}>Estado</th>
                <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.g500,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:`1px solid ${C.g200}`}}>Tiempo</th>
                <th style={{padding:'10px 14px',borderBottom:`1px solid ${C.g200}`}}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c=><QueueRow key={c.id} c={c} selected={c.id===sel} onClick={()=>setSel(c.id)} />)}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',background:C.g50}}>
        <CaseDetailPanel
          c={c}
          onAprobar={()=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'aprobado'}:x));push(`Caso ${c.id} aprobado`, ()=>setData(d=>d.map(x=>x.id===c.id?{...x,estado:'enviado'}:x)));}}
          onDevolver={(motivo)=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'devuelto',motivoDevolucion:motivo}:x));push(`Caso ${c.id} devuelto al analista`, ()=>setData(d=>d.map(x=>x.id===c.id?{...x,estado:'enviado'}:x)));}}
          onRechazar={()=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'rechazado'}:x));push(`Caso ${c.id} rechazado`, ()=>setData(d=>d.map(x=>x.id===c.id?{...x,estado:'enviado'}:x)));}}
        />
      </div>
      {toasts.map(t=><Toast key={t.id} msg={t.msg} onUndo={t.onUndo} onDone={()=>setToasts(p=>p.filter(x=>x.id!==t.id))} />)}
    </div>
  );
}

/* U2 FIX móvil: estado de devolución claro y row clickeable */
function MobileLayout({ data, setData }) {
  const [tab, setTab] = useState('cola');
  const [sel, setSel] = useState(null);
  const c = data.find(x=>x.id===sel);
  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 52px)',marginTop:52,background:C.g50}}>
      {!sel&&<div style={{flex:1,overflowY:'auto'}}>
        <div style={{padding:'14px 16px',background:C.white,borderBottom:`1px solid ${C.g200}`}}>
          <h2 style={{fontSize:16,fontWeight:600,color:C.g900,marginBottom:6}}>Mi cola — {data.length} casos</h2>
          <p style={{fontSize:11,color:C.g500}}>Toca un caso para ver el detalle y decidir.</p>
        </div>
        {/* U2 FIX: cards completas son clickeables; estado bien visible */}
        {data.map(c=>(
          <div key={c.id} onClick={()=>setSel(c.id)} style={{padding:'14px 16px',background:C.white,borderBottom:`1px solid ${C.g200}`,cursor:'pointer',display:'flex',gap:12,alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                <span style={{fontSize:14,fontWeight:600,color:C.g900}}>{c.name}</span>
                <span style={{fontSize:11,color:C.g500}}>{c.tiempo}</span>
              </div>
              <div style={{fontSize:12,color:C.g500,marginBottom:8}}>{c.id} · {c.monto}</div>
              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <StatusBadge estado={c.estado} />
                {c.anulado&&<span style={{fontSize:10,color:C.warn,fontWeight:600,background:C.warnL,padding:'2px 6px',borderRadius:10,border:`1px solid ${C.warn}30`}}>⚠ Override</span>}
              </div>
              {/* U2 FIX: motivo de devolución VISIBLE en móvil */}
              {c.estado==='devuelto'&&c.motivoDevolucion&&<div style={{marginTop:8,padding:'8px 10px',background:C.warnL,borderRadius:7,border:`1px solid ${C.warn}30`}}>
                <div style={{fontSize:10,fontWeight:600,color:C.warn,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:2}}>Motivo de devolución:</div>
                <div style={{fontSize:12,color:C.g900,lineHeight:1.4}}>{c.motivoDevolucion}</div>
              </div>}
            </div>
            <span style={{fontSize:18,color:C.g500,paddingTop:2}}>›</span>
          </div>
        ))}
      </div>}
      {sel&&c&&<div style={{flex:1,overflowY:'auto'}}>
        <button onClick={()=>setSel(null)} style={{background:C.white,border:'none',borderBottom:`1px solid ${C.g200}`,padding:'12px 16px',width:'100%',display:'flex',alignItems:'center',gap:8,color:C.magenta,fontSize:14,cursor:'pointer',fontFamily:'Roboto'}}>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M6 2L2 7l4 5" stroke={C.magenta} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Volver a la cola
        </button>
        <CaseDetailPanel
          c={c}
          onAprobar={()=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'aprobado'}:x));setSel(null);}}
          onDevolver={(m)=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'devuelto',motivoDevolucion:m}:x));setSel(null);}}
          onRechazar={()=>{setData(d=>d.map(x=>x.id===c.id?{...x,estado:'rechazado'}:x));setSel(null);}}
        />
      </div>}
    </div>
  );
}

function App() {
  const [data, setData] = useState(QUEUE);
  const [device, setDevice] = useState('desktop');
  return device==='desktop'
    ? <div data-screen-label="P4 Coordinador v2 RITE"><NavBar device={device} setDevice={setDevice} /><DesktopLayout data={data} setData={setData} /></div>
    : <div data-screen-label="P4 Coordinador v2 RITE móvil"><NavBar device={device} setDevice={setDevice} />
        <div style={{display:'flex',justifyContent:'center',alignItems:'flex-start',background:'#EDECEA',paddingTop:20,paddingBottom:20,minHeight:'calc(100vh - 52px)',marginTop:52,overflowY:'auto'}}>
          <div style={{width:390,background:C.white,borderRadius:24,overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,0.15)'}}>
            <MobileLayout data={data} setData={setData} />
          </div>
        </div>
      </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
